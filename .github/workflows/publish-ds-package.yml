name: Publish DS package

# Runs whenever code/core/package.json changes on main (i.e. someone bumped
# the version). Publishes automatically only if that version isn't already
# on npm — safe to merge without a version bump, this just no-ops then.
on:
  push:
    branches: [main]
    paths:
      - 'code/core/package.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Check if this version is already published
        id: version_check
        run: |
          LOCAL_VERSION=$(node -p "require('./code/core/package.json').version")
          PUBLISHED_VERSION=$(npm view cariva-design-system version 2>/dev/null || echo "none")
          echo "Local version: $LOCAL_VERSION"
          echo "Published version: $PUBLISHED_VERSION"
          if [ "$LOCAL_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm publish --workspace=code/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
